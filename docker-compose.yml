services:
  api:
    build:
      context: .
    image: energy-anomaly:latest
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  ui:
    image: energy-anomaly:latest
    command:
      [
        "streamlit",
        "run",
        "src/app_ui.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
      ]
    environment:
      ENERGY_API_BASE: "http://api:8000"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
